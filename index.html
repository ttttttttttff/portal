<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой портал</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    body { min-height:100vh; background:linear-gradient(135deg,#1e1e2f 0%,#2a1a4a 50%,#0f0f1a 100%);
           color:#fff; display:flex; align-items:center; justify-content:center; padding:20px; }
    .container { width:100%; max-width:900px; }
    h1 { text-align:center; margin-bottom:30px; font-size:2.4rem; font-weight:700;
         background:linear-gradient(90deg,#8b5cf6,#3b82f6); -webkit-background-clip:text;
         -webkit-text-fill-color:transparent; background-clip:text; }
    
    /* Сетка: 2 колонки, 2 строки */
    .modes { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    
    .mode-card {
      background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
      border-radius:16px; padding:40px 20px; text-align:center; cursor:pointer;
      transition:all .3s; backdrop-filter:blur(10px); color:#fff; text-decoration:none;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .mode-card:hover {
      transform:translateY(-5px); background:rgba(139,92,246,0.15);
      border-color:#8b5cf6; box-shadow:0 10px 30px rgba(139,92,246,0.3);
    }
    .mode-card .icon { font-size:3rem; margin-bottom:15px; display:block; }
    .mode-card .label { font-size:1.3rem; font-weight:600; }
    
    @media (max-width:600px) {
      .modes { grid-template-columns:1fr; }
      h1 { font-size:1.8rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Мой портал</h1>

    <div class="modes">
      <!-- Кнопка 1 -->
      <a class="mode-card" href="vpn.html">
        <span class="icon">🔑</span>
        <span class="label">VPN ключи</span>
      </a>
      
      <!-- Кнопка 2 (просто заголовок, никуда не ведет) -->
      <div class="mode-card" style="cursor: default;">
        <span class="icon">💾</span>
        <span class="label">Диск</span>
      </div>

      <!-- Кнопка 3 -->
      <a class="mode-card" href="personal.html">
        <span class="icon">👤</span>
        <span class="label">Личное</span>
      </a>

      <!-- Кнопка 4 -->
      <a class="mode-card" href="school.html">
        <span class="icon">🏫</span>
        <span class="label">Школа</span>
      </a>
    </div>
  </div>
</body>
</html>
